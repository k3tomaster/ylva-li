<html>

  body { font-family: sans-serif; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }

  img { max-width: 100%; height: auto; max-height: 300px; }
</style>
</head>
<body>

    <div class="item"><h2>3.jpeg</h2><img src="public/3.jpeg"></div>
    <div class="item"><h2>4.jpeg</h2><img src="public/4.jpeg"></div>
    <div class="item"><h2>5.jpeg</h2><img src="public/5.jpeg"></div>
    <div class="item"><h2>6.jpeg</h2><img src="public/6.jpeg"></div>
    <div class="item"><h2>7.jpeg</h2><img src="public/7.jpeg"></div>
    <div class="item"><h2>8.jpeg</h2><img src="public/8.jpeg"></div>
    <div class="item"><h2>9.jpeg</h2><img src="public/9.jpeg"></div>
  </div>
</body>
</html>
